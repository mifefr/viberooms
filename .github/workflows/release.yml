name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, name: viberooms-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: viberooms-linux-aarch64 }
          - { os: macos-latest, target: aarch64-apple-darwin, name: viberooms-macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p viberooms --target ${{ matrix.target }}
      - name: Package server
        run: |
          mkdir -p out
          tar -C target/${{ matrix.target }}/release -czf out/${{ matrix.name }}.tar.gz viberooms
      - name: Package menu bar app (macOS)
        if: runner.os == 'macOS'
        run: |
          ./deploy/macos/bundle-bar.sh
          (cd dist && zip -qry ../out/VibeRooms-macos-arm64.zip VibeRooms.app)
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
