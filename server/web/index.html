<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VibeRooms</title>
  <meta name="description" content="Self-hosted monitor of AI subscription and API limits">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <div class="page">
    <header class="topbar">
      <div class="brand">
        <img src="/favicon.svg" alt="" width="28" height="28">
        <div>
          <h1>VibeRooms</h1>
          <p data-i18n="subtitle"></p>
        </div>
      </div>
      <div class="actions">
        <span class="updated num" id="updated" aria-live="polite"></span>
        <button class="btn ghost icon" id="refreshAll" data-i18n-title="refresh_all"></button>
        <button class="btn primary" id="addAccount"><span class="ic-plus"></span><span class="lbl" data-i18n="add_account"></span></button>
        <div style="position:relative">
          <button class="btn ghost icon" id="settingsBtn" data-i18n-title="settings" aria-haspopup="true"></button>
        </div>
      </div>
    </header>

    <main id="main" aria-live="polite"></main>

    <details class="table-panel" id="tablePanel" hidden>
      <summary data-i18n="table_view"></summary>
      <div class="table-wrap"><table id="table"></table></div>
    </details>

    <footer class="foot" id="foot"></footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true"></aside>

  <dialog id="addDialog" class="dialog"><div class="dlg" id="addBody"></div></dialog>

  <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <script src="/i18n.js"></script>
  <script src="/app.js" defer></script>
</body>
</html>
