<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- VibeRooms: a "V" drawn as two gauges, one account full (white), one running low (warm). -->
  <defs>
    <linearGradient id="vr-tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7bff"/>
      <stop offset="1" stop-color="#5531d6"/>
    </linearGradient>
    <linearGradient id="vr-shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".22"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="vr-warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="1" stop-color="#ff8fc8"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#vr-tile)"/>
  <rect width="64" height="64" rx="15" fill="url(#vr-shine)"/>
  <g fill="none" stroke-width="9.5" stroke-linecap="round">
    <path d="M18 15.5 30.2 47M46 15.5 33.8 47" stroke="#fff" stroke-opacity=".28"/>
    <path d="M30.2 47 20.4 21.7" stroke="#fff"/>
    <path d="M33.8 47 39.3 32.8" stroke="url(#vr-warm)"/>
  </g>
</svg>
